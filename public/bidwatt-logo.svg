<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Bidwatt brand amber/yellow electric gradient -->
    <linearGradient id="bg" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fbbf24"/>
      <stop offset="0.5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="inner" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1c1917"/>
      <stop offset="1" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="bolt" x1="24" y1="12" x2="40" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fef08a"/>
      <stop offset="0.6" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="10" y="6" width="44" height="52" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer GPU chip badge with amber accent border -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#bg)"/>
  <rect x="6" y="6" width="52" height="52" rx="12" fill="url(#inner)"/>

  <!-- Gold/Amber contact pins -->
  <rect x="14" y="3" width="6" height="3" rx="1" fill="#f59e0b"/>
  <rect x="29" y="3" width="6" height="3" rx="1" fill="#f59e0b"/>
  <rect x="44" y="3" width="6" height="3" rx="1" fill="#f59e0b"/>

  <rect x="14" y="58" width="6" height="3" rx="1" fill="#d97706"/>
  <rect x="29" y="58" width="6" height="3" rx="1" fill="#d97706"/>
  <rect x="44" y="58" width="6" height="3" rx="1" fill="#d97706"/>

  <!-- High-voltage compute bolt in glowing amber/yellow -->
  <path d="M35 12L17 34H31L29 52L47 30H33L35 12Z" fill="url(#bolt)" filter="url(#glow)"/>
</svg>
